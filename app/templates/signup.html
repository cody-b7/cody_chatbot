{% extends "base.html" %}

{% block title %}회원가입{% endblock %}

{% block content %}
<h1>회원가입</h1>

{% if error == "duplicate" %}
<p>이미 사용 중인 아이디입니다.</p>
{% elif error == "invalid_username" %}
<p>올바른 아이디를 입력해주세요.</p>
{% elif error == "invalid_password" %}
<p>올바른 비밀번호를 입력해주세요.</p>
{% endif %}

<form method="post" action="/signup">
  <div>
    <label for="username">아이디</label>
    <input
      type="text"
      id="username"
      name="username"
      required
      autocomplete="username"
    >
  </div>

  <div>
    <label for="password">비밀번호</label>
    <input
      type="password"
      id="password"
      name="password"
      required
      autocomplete="new-password"
    >
  </div>

  <button type="submit">회원가입</button>
</form>

<p>
  이미 계정이 있나요?
  <a href="/login">로그인</a>
</p>
{% endblock %}

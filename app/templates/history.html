{% extends "base.html" %}
{% block title %}연습 기록{% endblock %}
{% block content %}
<div class="page">
  <h1>연습 기록</h1>
  <p class="lede">지금까지 연습한 대화입니다. 줄을 누르면 그때 주고받은 말이 펼쳐집니다.</p>

  <div class="tally" id="tally"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th scope="col">상황</th>
          <th scope="col">시작한 때</th>
          <th scope="col">주고받은 말</th>
          <th scope="col">교정</th>
          <th scope="col">마지막 대화</th>
          <th scope="col"><span class="sr-only">이어하기</span></th>
        </tr>
      </thead>
      <tbody id="sessions"></tbody>
    </table>
  </div>
</div>

<script>
(() => {
  const labels = {{ labels | tojson }};
  const label = (key) => labels[key] || key;
  const fmt = (s) => s ? new Date(s).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' }) : '-';
  const esc = (t) => { const d = document.createElement('div'); d.textContent = t ?? ''; return d.innerHTML; };

  // 로그인이 풀렸으면 로그인 화면으로, 그 밖의 실패는 예외로 올린다
  async function getJSON(url) {
    const res = await fetch(url);
    if (res.status === 401) { location.href = '/login'; throw new Error('unauthorized'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  async function load() {
    let stats, sessions;
    try {
      [stats, sessions] = await Promise.all([getJSON('/api/me/stats'), getJSON('/api/me/sessions')]);
    } catch {
      document.getElementById('sessions').innerHTML =
        '<tr><td colspan="6" class="empty-row">기록을 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.</td></tr>';
      return;
    }

    document.getElementById('tally').innerHTML = [
      [stats.total_sessions, '연습한 대화'],
      [stats.total_turns, '주고받은 말'],
      [stats.total_corrections, '받은 교정'],
    ].map(([value, name]) => `<div><b>${esc(String(value))}</b><span>${name}</span></div>`).join('');

    const tbody = document.getElementById('sessions');
    if (!sessions.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-row">아직 연습한 대화가 없습니다. <a href="/">첫 대화를 시작해 보세요.</a></td></tr>';
      return;
    }

    tbody.innerHTML = sessions.map(s => `
      <tr class="session" data-id="${s.id}" tabindex="0" aria-expanded="false">
        <td>${esc(label(s.scenario))}</td>
        <td>${fmt(s.created_at)}</td>
        <td class="num">${s.turn_count}</td>
        <td class="num">${s.correction_count}</td>
        <td>${fmt(s.last_message_at)}</td>
        <td><a href="/?session=${s.id}">이어하기</a></td>
      </tr>
      <tr class="turns" id="turns-${s.id}" hidden><td colspan="6">불러오는 중</td></tr>
    `).join('');

    tbody.querySelectorAll('tr.session').forEach(row => {
      const open = (e) => { if (!e.target.closest('a')) toggle(row); };
      row.addEventListener('click', open);
      row.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(e); }
      });
    });
  }

  const loaded = new Set();

  async function toggle(row) {
    const id = row.dataset.id;
    const panel = document.getElementById('turns-' + id);
    panel.hidden = !panel.hidden;
    row.setAttribute('aria-expanded', String(!panel.hidden));
    if (panel.hidden || loaded.has(id)) return;

    // 이어하기 화면과 같은 API 를 쓴다 (세션 하나의 대화, 오래된 순)
    const cell = panel.firstElementChild;
    let detail;
    try {
      detail = await getJSON('/api/me/sessions/' + encodeURIComponent(id));
    } catch {
      cell.textContent = '대화를 불러오지 못했습니다. 다시 눌러 보세요.';
      panel.hidden = true;
      row.setAttribute('aria-expanded', 'false');
      return;
    }
    loaded.add(id);

    if (!detail.turns.length) { cell.textContent = '이 대화에는 주고받은 말이 없습니다.'; return; }

    cell.innerHTML = detail.turns.map(c => `
      <div class="pair">
        <p class="said">${esc(c.question)}</p>
        <p class="reply">${esc(c.answer)}</p>
        ${c.correction ? `<p class="note"><span>${esc(c.correction)}</span></p>` : ''}
      </div>
    `).join('');
  }

  load();
})();
</script>
{% endblock %}

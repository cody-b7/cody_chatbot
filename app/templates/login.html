{% extends "base.html" %}

{% block title %}로그인{% endblock %}

{% block content %}
<div class="auth">
  <a class="brand" href="/login">Cody</a>
  <p class="lede">카페에서 주문하고, 공항에서 체크인하며 영어로 말해 보는 연습장</p>

  <h1>로그인</h1>

  <form method="post" action="/login">
    {% if error == "bad_credentials" %}
    <p class="form-error" role="alert">아이디나 비밀번호가 맞지 않습니다. 다시 입력해 주세요.</p>
    {% endif %}

    <div class="field">
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" required autocomplete="username"
             value="{{ entered_username or '' }}" {% if not entered_username %}autofocus{% endif %}>
    </div>

    <div class="field">
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" required autocomplete="current-password"
             {% if entered_username %}autofocus{% endif %}>
    </div>

    <button type="submit" class="button">로그인</button>
  </form>

  <p class="switch">처음이라면 <a href="/signup">회원가입</a></p>
</div>
{% endblock %}

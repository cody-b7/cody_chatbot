{% extends "base.html" %}
{% block title %}자주 틀리는 표현{% endblock %}
{% block content %}
<div class="page">
  <h1>자주 틀리는 표현</h1>
  <p class="lede">연습하면서 받은 교정을 모았습니다. 한 번씩 소리 내어 다시 말해 보면 같은 실수가 줄어듭니다.</p>

  <div class="filters" id="filters" role="group" aria-label="상황별로 보기"></div>
  <ul class="fix-list" id="list"></ul>
</div>

<script>
(() => {
  const labels = {{ labels | tojson }};
  const label = (key) => labels[key] || key;
  const fmt = (s) => new Date(s).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' });
  const esc = (t) => { const d = document.createElement('div'); d.textContent = t ?? ''; return d.innerHTML; };

  let counts = {};

  async function load(scenario) {
    if (!Object.keys(counts).length) {
      counts = await fetch('/api/me/corrections/by-scenario').then(r => r.json());
    }
    const total = Object.values(counts).reduce((a, b) => a + b, 0);

    const filters = [['전체', null, total], ...Object.entries(counts).map(([key, n]) => [label(key), key, n])];
    const box = document.getElementById('filters');
    box.innerHTML = filters.map(([name, key, n]) =>
      `<button type="button" data-key="${key ?? ''}" aria-pressed="${(key ?? null) === scenario}">${esc(name)}<span class="n">${n}</span></button>`
    ).join('');
    box.querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => load(b.dataset.key || null))
    );

    const url = '/api/me/corrections?limit=100' + (scenario ? '&scenario=' + encodeURIComponent(scenario) : '');
    const items = await fetch(url).then(r => r.json());

    document.getElementById('list').innerHTML = items.length
      ? items.map(c => `
          <li>
            <p class="when">${esc(label(c.scenario))}에서, ${fmt(c.created_at)}</p>
            <p class="said">${esc(c.question)}</p>
            <p class="note"><span>${esc(c.correction)}</span></p>
          </li>`).join('')
      : '<li class="empty-row">아직 받은 교정이 없습니다. <a href="/">연습을 시작해 보세요.</a></li>';
  }

  load(null);
})();
</script>
{% endblock %}

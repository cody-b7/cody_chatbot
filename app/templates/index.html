{% extends "base.html" %}
{% block title %}영어 회화 연습{% endblock %}
{% block content %}
<h1>영어 회화 연습</h1>

<!-- TODO(B): 아래는 파이프라인 확인용 최소 화면. 자유롭게 다시 만들 것. -->
<select id="scenario">
  {% for s in scenarios %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
</select>
<div id="log"></div>
<form id="f"><input id="msg" autocomplete="off" placeholder="영어로 입력하세요"><button>보내기</button></form>

<script>
let sessionId = null;
const log = document.getElementById('log');
const add = (who, text) => { const p = document.createElement('p'); p.textContent = who + ': ' + text; log.appendChild(p); };

// TODO(B): 화면을 새로 만드실 때 아래 '이어하기' 동작만 옮겨와 주세요.
//   /history 에서 넘어올 때 ?session=<id> 가 붙습니다.
//   세션 상세를 불러와 지난 대화를 복원하고, 같은 세션으로 이어서 보냅니다.
async function resumeFromQuery() {
  const id = new URLSearchParams(location.search).get('session');
  if (!id) return;

  const res = await fetch('/api/me/sessions/' + encodeURIComponent(id));
  if (!res.ok) { add('안내', '이어할 대화를 찾지 못했어요. 새로 시작합니다.'); return; }

  const detail = await res.json();
  sessionId = detail.id;
  document.getElementById('scenario').value = detail.scenario;
  detail.turns.forEach(t => {
    add('나', t.question);
    add('상대', t.answer);
    if (t.correction) add('교정', t.correction);
  });
  add('안내', '지난 대화에 이어서 연습합니다.');
}
resumeFromQuery();

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('msg');
  const message = input.value.trim();
  if (!message) return;
  add('나', message);
  input.value = '';

  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, scenario: document.getElementById('scenario').value, session_id: sessionId })
  });
  const data = await res.json();
  if (!res.ok) { add('오류', data.message || '문제가 발생했어요.'); return; }
  sessionId = data.session_id;
  add('상대', data.reply);
  if (data.correction) add('교정', data.correction);
});
</script>
{% endblock %}

# 린트 규칙을 명시적으로 고정한다.
# ruff 기본값에 의존하면 버전이 올라갈 때 CI가 갑자기 깨진다.
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]

[lint.flake8-bugbear]
# FastAPI 는 Depends/Query 를 인자 기본값에 두는 것이 정석 패턴이라
# B008(기본값에서 함수 호출 금지)의 예외로 둔다.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Security",
]
